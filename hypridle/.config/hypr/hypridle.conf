general {
    lock_cmd = pidof hyprlock || hyprlock       # runs hyprlock if not already running
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = ~/.config/hypr/scripts/idle_handler.sh restore
}

# 1) Ekran kilitliyse -> 1 dakika (60 sn) sonra ekranı tamamen kapat
listener {
    timeout = 60
    on-timeout = pidof hyprlock && ~/.config/hypr/scripts/idle_handler.sh dim
    on-resume = ~/.config/hypr/scripts/idle_handler.sh restore
}

# 2) Ekran kilitli değilse -> 4.5 dakika (270 sn) sonra önce oturumu kilitle
listener {
    timeout = 270
    on-timeout = loginctl lock-session
}

# 3) Ekran kilitli değilken 5 dakika (300 sn) dolduğunda ekranı kapat
# (Kilit ekranı oluştuktan sonra ekran kapatılarak GPU çakışması önlenir)
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle_handler.sh dim
    on-resume = ~/.config/hypr/scripts/idle_handler.sh restore
}
