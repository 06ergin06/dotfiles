general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/wake.sh
}

# ─── Battery-only idle chain ───────────────────────────────────────────────
# On AC power the scripts exit immediately, so nothing happens.
# On battery the full chain below runs.

# 1) 3 minutes idle → lock screen
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/idle-lock.sh
}

# 2) 5 minutes idle → turn off all monitors
#    on-resume runs when any input is detected (key / mouse / touch).
#    A short sleep gives Hyprland time to fully restore the session before
#    flipping DPMS back on, which prevents the "screen stays black" bug.
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/idle-dpms-off.sh
    on-resume = sleep 0.3 && hyprctl dispatch dpms on
}
